name: Update Goa News

on:
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install feedparser google-genai

      - name: Run News Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: Check Generated Files
        run: |
          echo "Files generated:"
          ls -la
          echo ""
          echo "Checking news.json:"
          test -f news.json
          head -30 news.json

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html news.json

          git diff --cached --quiet || git commit -m "Auto-update Goa news"

          git push
